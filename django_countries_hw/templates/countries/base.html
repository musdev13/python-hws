<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Країни світу{% endblock %}</title>
  <style>
    :root { --blue:#2457a6; --ink:#1d2939; --muted:#667085; --line:#dfe3ea; --bg:#f5f7fb; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:Arial,sans-serif; }
    header { background:white; border-bottom:1px solid var(--line); }
    nav { max-width:1100px; margin:auto; padding:14px 20px; display:flex; gap:16px; flex-wrap:wrap; }
    nav a { color:var(--blue); text-decoration:none; font-weight:bold; }
    main { max-width:1100px; margin:auto; padding:28px 20px 50px; }
    h1 { margin-top:0; }
    .error { padding:12px 16px; background:#fff0f0; border:1px solid #efb7b7; color:#9e2a2a; border-radius:8px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; list-style:none; padding:0; }
    .grid li a, .list a { display:block; padding:12px 14px; background:white; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; }
    .grid li a:hover, .list a:hover { border-color:var(--blue); color:var(--blue); }
    .card { background:white; border:1px solid var(--line); border-radius:10px; padding:22px; }
    .meta { display:grid; grid-template-columns:minmax(120px,220px) 1fr; gap:10px 20px; }
    .meta dt { color:var(--muted); } .meta dd { margin:0; }
    .back { display:inline-block; margin-bottom:18px; color:var(--muted); text-decoration:none; }
    select { padding:9px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:18px; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="{% url 'countries' %}">Країни</a>
      <a href="{% url 'regions' %}">Регіони</a>
      <a href="{% url 'languages' %}">Мови</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
