<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Довідник програміста{% endblock %}</title>
<style>
  :root {
    --bg: #f4f2ee;
    --surface: #ffffff;
    --ink: #1f2933;
    --muted: #6b7280;
    --border: #d8d4cc;
    --accent: #1f6feb;
    --accent-ink: #ffffff;
    --danger: #b42318;
    --danger-bg: #fdeceb;
    --success: #0f5132;
    --success-bg: #e6f4ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  .container { max-width: 780px; margin: 0 auto; padding: 0 20px; }
  header.site {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  header.site .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
  }
  header.site a.brand {
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
    font-size: 1.05rem;
  }
  nav.site a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 18px;
    font-size: 0.95rem;
  }
  nav.site a:hover { color: var(--ink); }
  main { padding: 32px 0 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  .card + .card { margin-top: 20px; }
  .form-row { margin-bottom: 16px; }
  .form-row:last-child { margin-bottom: 0; }
  .form-row label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ink);
  }
  input[type="text"], input[type="password"], input[type="email"],
  input[type="number"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.15);
  }
  textarea { resize: vertical; min-height: 80px; }
  .choices { display: flex; flex-wrap: wrap; gap: 10px 20px; }
  .choices label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 400;
    margin: 0;
    cursor: pointer;
  }
  .choices input { width: auto; margin: 0; }
  .checkbox-row label { display: inline-flex; align-items: center; gap: 10px; font-weight: 400; }
  .checkbox-row input { width: auto; margin: 0; }
  .actions { margin-top: 20px; }
  button.btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: 0;
    padding: 10px 18px;
    border-radius: 8px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn:hover { background: #1858c4; }
  .errors {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f5c2bf;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 0.95rem;
  }
  .errors ul { margin: 6px 0 0; padding-left: 18px; }
  .result {
    margin-top: 22px;
    border-radius: 10px;
    padding: 16px 18px;
    border: 1px solid var(--border);
    background: var(--success-bg);
    color: var(--success);
  }
  .result.is-error { background: var(--danger-bg); color: var(--danger); border-color: #f5c2bf; }
  .result h3 { margin: 0 0 8px; font-size: 1rem; }
  .result dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  .result dt { font-weight: 600; }
  .result dd { margin: 0; }
  .menu { display: grid; gap: 12px; margin-top: 8px; }
  .menu a.tile {
    display: block;
    padding: 16px 18px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    text-decoration: none;
    transition: border-color 0.15s, transform 0.05s;
  }
  .menu a.tile:hover { border-color: var(--accent); }
  .menu a.tile:active { transform: translateY(1px); }
  .menu .tile-title { font-weight: 600; }
  .menu .tile-desc { color: var(--muted); font-size: 0.92rem; margin-top: 2px; }
  .back { display: inline-block; margin-bottom: 16px; color: var(--muted); text-decoration: none; font-size: 0.92rem; }
  .back:hover { color: var(--ink); }
</style>
</head>
<body>
  <header class="site">
    <div class="container">
      <a class="brand" href="{% url 'index' %}">Довідник програміста</a>
      <nav class="site">
        <a href="{% url 'task1' %}">Вхід</a>
        <a href="{% url 'task2' %}">Калькулятор</a>
        <a href="{% url 'task3' %}">Реєстрація</a>
        <a href="{% url 'task4' %}">День програміста</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
